<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Inkverse Studio — Art by Shivam</title>

<meta name="description" content="Inkverse Studio — Premium charcoal, graphite and custom artwork by Shivam.">
<meta name="theme-color" content="#f8f6f0">

<link rel="manifest" href="./manifest.json">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box
}

html,
body{
  width:100%;
  height:100%;
}

body{
  font-family:Arial,sans-serif;
  background:#f8f6f0;
  color:#171717;
  overflow:hidden;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  height:78px;
  background:#f8f6f0;
  border-bottom:1px solid #ddd8cc;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  flex-shrink:0;
}

 .logo{
  width:78px;
  height:78px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  user-select:none;
  flex-shrink:0;
}

.logo img{
  width:78px;
  height:78px;
  display:block;
  object-fit:contain;
}

.logo span{
  display:none;
}

.pages{
  flex:1;
  position:relative;
  overflow:hidden;
}

.page{
  position:absolute;
  inset:0;
  overflow-y:auto;
  padding:45px 25px 110px;
  opacity:0;
  transform:translateX(25px);
  pointer-events:none;
  transition:opacity .3s ease,transform .3s ease;
  -webkit-overflow-scrolling:touch;
}

.page.active{
  opacity:1;
  transform:translateX(0);
  pointer-events:auto;
}

.home{
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:100%;
}

.small-title{
  color:#a17b35;
  letter-spacing:5px;
  font-size:13px;
  margin-bottom:35px;
}

h1{
  font-family:Georgia,serif;
  font-size:58px;
  line-height:.95;
  max-width:700px;
}

h1 span{
  color:#a17b35;
  font-style:italic;
}

.line{
  width:105px;
  height:2px;
  background:#a17b35;
  margin:40px auto 28px;
}

.description{
  max-width:600px;
  color:#686868;
  font-size:17px;
  line-height:1.7;
}

.primary-btn{
  margin-top:35px;
  border:none;
  background:#171717;
  color:white;
  padding:18px 35px;
  font-size:13px;
  letter-spacing:3px;
  cursor:pointer;
  transition:.25s;
  touch-action:manipulation;
}

.primary-btn:hover{
  background:#a17b35;
}

.primary-btn:active{
  transform:scale(.98);
}

.primary-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.section-title{
  font-family:Georgia,serif;
  font-size:42px;
  margin-bottom:15px;
}

.section-subtitle{
  color:#777;
  line-height:1.7;
  margin-bottom:35px;
}

.card,
.contact-card{
  background:#fff;
  border:1px solid #e3dfd5;
  padding:25px;
}

.card h3{
  font-family:Georgia,serif;
  font-size:22px;
  margin-bottom:12px;
}

.card p,
.contact-card{
  line-height:1.6;
}

.card p,
.contact-card a{
  color:#777;
}

.gallery-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:22px;
}

.art-card{
  background:#fff;
  border:1px solid #e3dfd5;
  padding:12px;
  cursor:pointer;
  transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;
}

.art-card:hover{
  transform:translateY(-4px);
  border-color:#b99a5b;
  box-shadow:0 12px 30px rgba(0,0,0,.08);
}

.art-image{
  width:100%;
  height:250px;
  background:#e8e3d8;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  margin-bottom:15px;
}

.art-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform .4s ease;
}

.art-card:hover .art-image img{
  transform:scale(1.03);
}

.art-image::before{
  content:"";
  position:absolute;
  width:120px;
  height:120px;
  border:1px solid rgba(161,123,53,.35);
  transform:rotate(45deg);
  pointer-events:none;
  z-index:2;
}

.art-image span{
  position:relative;
  z-index:3;
  font-family:Georgia,serif;
  color:#8c806a;
  font-size:14px;
  letter-spacing:2px;
}

.art-info{
  padding:3px 5px 10px;
}

.art-category{
  display:inline-block;
  color:#a17b35;
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:7px;
}

.art-title{
  font-family:Georgia,serif;
  font-size:21px;
  margin-bottom:7px;
}

.art-description{
  color:#777;
  font-size:13px;
  line-height:1.6;
}

.art-like-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:13px;
}

.like-btn{
  border:1px solid #ddd8cc;
  background:#fff;
  color:#777;
  min-width:90px;
  padding:8px 11px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-size:12px;
  cursor:pointer;
  transition:.2s;
}

.like-btn:hover{
  border-color:#a17b35;
  color:#a17b35;
}

.like-btn.liked{
  border-color:#a17b35;
  color:#a17b35;
  background:#fffdf8;
}

.like-heart{
  font-size:17px;
  line-height:1;
}

.like-count{
  font-size:11px;
  color:#888;
}

.like-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.empty-gallery,
.management-empty{
  grid-column:1/-1;
  text-align:center;
  padding:45px 20px;
  background:#fff;
  border:1px solid #e3dfd5;
  color:#777;
  line-height:1.6;
}

.art-viewer{
  position:fixed;
  inset:0;
  background:rgba(10,10,10,.96);
  z-index:1000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:30px;
  opacity:0;
  transition:opacity .25s ease;
}

.art-viewer.show{
  display:flex;
  opacity:1;
}

.art-viewer-content{
  width:100%;
  height:100%;
  max-width:1200px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
}

.art-viewer-image-wrap{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  flex:1;
  min-height:0;
  padding:20px 10px;
}

.art-viewer-image{
  max-width:100%;
  max-height:75vh;
  width:auto;
  height:auto;
  object-fit:contain;
  display:block;
  box-shadow:0 20px 70px rgba(0,0,0,.5);
}

.art-viewer-info{
  width:100%;
  max-width:800px;
  text-align:center;
  padding:15px 20px 5px;
  color:white;
}

.art-viewer-category{
  color:#c29a50;
  font-size:10px;
  letter-spacing:3px;
  text-transform:uppercase;
  margin-bottom:7px;
}

.art-viewer-title{
  font-family:Georgia,serif;
  font-size:30px;
  margin-bottom:7px;
}

.art-viewer-description{
  color:#c5c5c5;
  font-size:13px;
  line-height:1.6;
  max-width:650px;
  margin:auto;
}

.art-viewer-close{
  position:absolute;
  top:5px;
  right:5px;
  width:48px;
  height:48px;
  border:1px solid rgba(255,255,255,.35);
  background:rgba(0,0,0,.3);
  color:white;
  font-size:25px;
  line-height:1;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.25s;
  z-index:5;
}

.art-viewer-close:hover{
  background:#a17b35;
  border-color:#a17b35;
}

.art-viewer-hint{
  color:#888;
  font-size:10px;
  letter-spacing:1px;
  margin-top:8px;
}

.coming{
  border:1px solid #b99a5b;
  padding:45px 25px;
  text-align:center;
  background:#fffdf8;
}

.coming h2{
  font-family:Georgia,serif;
  font-size:34px;
  margin-bottom:15px;
}

.coming p{
  color:#777;
  line-height:1.7;
}

.commission-form{
  max-width:650px;
  margin-top:25px;
}

.commission-form label,
.admin-box label,
.add-artwork-form label,
.edit-artwork-box label{
  display:block;
  font-size:11px;
  font-weight:bold;
  letter-spacing:1px;
  margin:18px 0 7px;
}

.commission-form label span{
  color:#999;
  font-weight:normal;
}

.commission-form input,
.commission-form select,
.commission-form textarea,
.admin-box input,
.admin-box select,
.admin-box textarea,
.add-artwork-form input,
.add-artwork-form select,
.add-artwork-form textarea,
.edit-artwork-box input,
.edit-artwork-box select,
.edit-artwork-box textarea{
  width:100%;
  padding:14px;
  border:1px solid #ddd8cc;
  background:#fff;
  font-family:Arial,sans-serif;
  font-size:14px;
  outline:none;
  border-radius:0;
}

.commission-form textarea,
.add-artwork-form textarea,
.edit-artwork-box textarea{
  resize:vertical;
}

.commission-form input:focus,
.commission-form select:focus,
.commission-form textarea:focus,
.admin-box input:focus,
.admin-box select:focus,
.admin-box textarea:focus,
.add-artwork-form input:focus,
.add-artwork-form select:focus,
.add-artwork-form textarea:focus,
.edit-artwork-box input:focus,
.edit-artwork-box select:focus,
.edit-artwork-box textarea:focus{
  border-color:#a17b35;
}

.form-note,
.file-note,
.edit-image-note{
  margin-top:12px;
  color:#999;
  font-size:11px;
  line-height:1.5;
}

.contact-card{
  margin-bottom:15px;
}

.contact-card strong{
  display:block;
  margin-bottom:8px;
  color:#171717;
}

.contact-card a{
  color:#a17b35;
  text-decoration:none;
  word-break:break-word;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:75px;
  background:rgba(255,255,255,.97);
  border-top:1px solid #ddd8cc;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:100;
  padding-bottom:env(safe-area-inset-bottom);
}

.nav-btn{
  border:none;
  background:none;
  color:#777;
  min-width:58px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  font-size:10px;
  cursor:pointer;
  touch-action:manipulation;
}

.nav-icon{
  font-size:21px;
  line-height:1;
}

.nav-btn.active{
  color:#a17b35;
}

.nav-btn.active .nav-icon{
  transform:translateY(-2px);
}

.more-wrapper{
  position:relative;
}

.more-menu{
  position:absolute;
  bottom:72px;
  right:0;
  width:180px;
  background:#fffdf8;
  border:1px solid #ddd8cc;
  box-shadow:0 10px 30px rgba(0,0,0,.12);
  padding:8px;
  opacity:0;
  visibility:hidden;
  transform:translateY(10px);
  transition:opacity .25s ease,transform .25s ease,visibility .25s ease;
}

.more-menu.show{
  opacity:1;
  visibility:visible;
  transform:translateY(0);
}

.more-item{
  width:100%;
  border:none;
  background:none;
  padding:14px 12px;
  text-align:left;
  font-size:13px;
  color:#333;
  cursor:pointer;
}

.more-item:hover{
  background:#f5f1e8;
  color:#a17b35;
}

.admin-overlay,
.edit-artwork-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:500;
  overflow-y:auto;
}

.admin-overlay.show,
.edit-artwork-overlay.show{
  display:flex;
}

.admin-box,
.edit-artwork-box{
  width:100%;
  max-width:500px;
  background:#fffdf8;
  border:1px solid #b99a5b;
  padding:30px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}

.admin-box h2,
.edit-artwork-box h2{
  font-family:Georgia,serif;
  font-size:30px;
  margin-bottom:8px;
}

.admin-subtitle,
.edit-artwork-subtitle{
  color:#777;
  font-size:12px;
  line-height:1.6;
  margin-bottom:22px;
}

.admin-actions,
.edit-artwork-actions{
  display:flex;
  gap:10px;
  margin-top:22px;
}

.admin-actions button,
.edit-artwork-actions button{
  flex:1;
}

.secondary-btn{
  border:1px solid #ddd8cc;
  background:#fff;
  color:#333;
  padding:15px;
  cursor:pointer;
}

.admin-error,
.edit-status{
  display:none;
  margin-top:15px;
  padding:13px;
  background:#f5f1e8;
  border-left:3px solid #a17b35;
  font-size:12px;
  line-height:1.5;
}

.admin-error.show,
.edit-status.show{
  display:block;
}

.admin-panel{
  position:fixed;
  inset:0;
  background:#f8f6f0;
  z-index:400;
  display:none;
  overflow-y:auto;
}

.admin-panel.show{
  display:block;
}

.admin-header{
  height:75px;
  background:#fffdf8;
  border-bottom:1px solid #ddd8cc;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  position:sticky;
  top:0;
  z-index:10;
}

.admin-brand{
  font-family:Georgia,serif;
  font-size:22px;
}

.admin-brand span{
  color:#a17b35;
}

.admin-close{
  border:1px solid #ddd8cc;
  background:#fff;
  padding:10px 14px;
  cursor:pointer;
}

.admin-content{
  max-width:900px;
  margin:auto;
  padding:35px 20px 60px;
}

.admin-content h1{
  font-family:Georgia,serif;
  font-size:40px;
  margin-bottom:10px;
}

.admin-content>p{
  color:#777;
  line-height:1.6;
}

.admin-card{
  margin-top:30px;
  background:#fff;
  border:1px solid #e3dfd5;
  padding:25px;
}

.admin-card h2{
  font-family:Georgia,serif;
  font-size:25px;
  margin-bottom:10px;
}

.admin-card p{
  color:#777;
  font-size:13px;
  line-height:1.6;
}

.admin-status{
  margin-top:20px;
  padding:15px;
  background:#f5f1e8;
  border-left:3px solid #a17b35;
  font-size:13px;
  line-height:1.5;
}

.upload-status{
  display:none;
  margin-top:18px;
  padding:14px;
  background:#f5f1e8;
  border-left:3px solid #a17b35;
  font-size:12px;
  line-height:1.5;
}

.upload-status.show{
  display:block;
}

.admin-artwork-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
  margin-top:25px;
}

.admin-artwork-card{
  background:#fffdf8;
  border:1px solid #e3dfd5;
  padding:12px;
}

.admin-artwork-image{
  width:100%;
  height:220px;
  background:#e8e3d8;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:14px;
}

.admin-artwork-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.admin-artwork-info{
  padding:3px 4px;
}

.admin-artwork-type{
  color:#a17b35;
  font-size:10px;
  letter-spacing:2px;
  text-transform:uppercase;
  margin-bottom:7px;
}

.admin-artwork-title{
  font-family:Georgia,serif;
  font-size:20px;
  margin-bottom:7px;
}

.admin-artwork-description{
  color:#777;
  font-size:12px;
  line-height:1.5;
}

.delete-artwork-btn,
.edit-artwork-btn{
  width:100%;
  margin-top:10px;
  padding:13px;
  font-size:11px;
  letter-spacing:2px;
  cursor:pointer;
  transition:.25s;
}

.delete-artwork-btn{
  border:1px solid #b33;
  background:#fff;
  color:#a33;
}

.delete-artwork-btn:hover{
  background:#a33;
  color:#fff;
}

.edit-artwork-btn{
  border:1px solid #a17b35;
  background:#fff;
  color:#a17b35;
}

.edit-artwork-btn:hover{
  background:#a17b35;
  color:#fff;
}

.delete-artwork-btn:disabled,
.edit-artwork-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.edit-image-preview{
  width:100%;
  height:220px;
  margin-top:12px;
  background:#e8e3d8;
  overflow:hidden;
  display:none;
}

.edit-image-preview.show{
  display:block;
}

.edit-image-preview img{
  width:100%;
  height:100%;
  object-fit:cover;
}

@media(max-width:600px){

  header{
    height:72px;
    padding:0 22px;
  }

  .logo{
    width:58px;
    height:58px;
  }

  .logo img{
    width:58px;
    height:58px;
  }

  .page{
    padding:35px 20px 105px;
  }

  h1{
    font-size:51px;
  }

  .description{
    font-size:16px;
  }

  .section-title{
    font-size:37px;
  }

  .gallery-grid{
    grid-template-columns:1fr;
    gap:18px;
  }

  .art-image{
    height:220px;
  }

  .bottom-nav{
    height:72px;
  }

  .nav-btn{
    min-width:50px;
    font-size:9px;
  }

  .nav-icon{
    font-size:20px;
  }

  .more-menu{
    bottom:70px;
    right:-5px;
  }

  .admin-box,
  .edit-artwork-box{
    padding:25px;
  }

  .admin-content h1{
    font-size:34px;
  }

  .admin-artwork-grid{
    grid-template-columns:1fr;
  }

  .admin-artwork-image{
    height:220px;
  }

  .art-viewer{
    padding:15px;
  }

  .art-viewer-image-wrap{
    padding:40px 0 15px;
  }

  .art-viewer-image{
    max-width:100%;
    max-height:65vh;
  }

  .art-viewer-title{
    font-size:25px;
  }

  .art-viewer-description{
    font-size:12px;
  }

  .art-viewer-close{
    top:0;
    right:0;
    width:44px;
    height:44px;
  }
}

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>

<body>

<div class="app">
